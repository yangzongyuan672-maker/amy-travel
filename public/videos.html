<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amy Archive | Motion Wall</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Amy Archive</a>
      <nav>
        <a href="/">旅行集</a>
        <a href="#videos">视频</a>
      </nav>
    </header>

    <main>
      <section class="album-hero motion-page-hero">
        <div>
          <p class="kicker">Motion Archive</p>
          <h1>流动影像</h1>
        </div>
        <p>把 iPhone 实况照片和短视频整理成一面安静的影像墙，让旅途里的声音、风和光继续流动。</p>
      </section>

      <section class="motion-archive" id="videos">
        <div class="motion-grid all" id="allVideos"></div>
      </section>
    </main>

    <footer class="footer">
      <span>Amy Archive</span>
      <p><a href="/">返回目录</a></p>
    </footer>

    <script src="videos.js"></script>
  </body>
</html>
